// pluginManagement must be the first statement in the file, so the mirror URL is inlined.
//
// AGP internals (com.android.tools:*) are only on dl.google.com, so google() comes first.
// Everything else resolves through Google's GCS mirror of Maven Central: direct repo1 traffic
// from CI egress IPs gets HTTP 429 rate-limited, and gradlePluginPortal() proxies to the same
// upstream. repo1 and the plugin portal stay as fallbacks.
pluginManagement {
    repositories {
        google()
        maven { url = 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        maven { url = 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
    }
}

rootProject.name = 'Sensors-Data-Logger'
include ':app'
