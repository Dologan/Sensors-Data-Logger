name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Signing is optional: without the secrets the build still runs and publishes unsigned
      # artifacts, so CI is never red merely for want of a keystore.
      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No KEYSTORE_BASE64 secret set — publishing unsigned artifacts."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble release
        env:
          UANNASCAN_KEYSTORE: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          UANNASCAN_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          UANNASCAN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          UANNASCAN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find . -path ./dist -prune -o \( -name "*-release.apk" -o -name "*-release.aab" -o -name "*-release-unsigned.apk" \) -print -exec cp {} dist/ \;
          ls -la dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Sensors-Data-Logger ${{ github.ref_name }}

            Signed: ${{ steps.keystore.outputs.signed }}
