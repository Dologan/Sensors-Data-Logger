apply plugin: 'com.android.application'

android {
    namespace 'com.pjinkim.sensors_data_logger'
    compileSdk 37

    defaultConfig {
        applicationId "com.pjinkim.sensors_data_logger"
        minSdkVersion 26
        // Deliberately held at 34: targetSdk is an opt-in to runtime restrictions, and this is a
        // sideloaded research tool, not a Play Store app. See UannaScan docs/compatibility.md.
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    // Signing is optional; without a keystore the release build is simply unsigned.
    signingConfigs {
        release {
            def keystorePath = System.getenv("UANNASCAN_KEYSTORE")
            if (keystorePath != null && !keystorePath.isEmpty() && file(keystorePath).exists()) {
                storeFile file(keystorePath)
                storePassword System.getenv("UANNASCAN_KEYSTORE_PASSWORD")
                keyAlias System.getenv("UANNASCAN_KEY_ALIAS")
                keyPassword System.getenv("UANNASCAN_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        // Nothing above minSdk may be called unguarded.
        error += 'NewApi'
        abortOnError true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.core:core:1.19.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
